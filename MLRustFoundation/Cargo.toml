[package]
name = "mlrust_foundation"
version = "0.1.0"
edition = "2021"

[dependencies]
ndarray = "0.15"
rand = "0.8"
rand_distr = "0.4"
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.17"
smallvec = "1.11"
reqwest = { version = "0.11", features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"
flate2 = "1.0"
byteorder = "1.4"

[dev-dependencies]
criterion = "0.5"
approx = "0.5"

[[bin]]
name = "mlrust"
path = "src/bin/mlrust.rs"

[[bench]]
name = "cnn_bench"
harness = false